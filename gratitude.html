<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>aurio · gratitude pebble</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #DDEAD4 0%, #C2D5B3 100%);
      font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .back-home {
      display: inline-block;
      background: rgba(255, 255, 245, 0.85);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(200, 190, 160, 0.5);
      padding: 0.5rem 1.2rem;
      border-radius: 60px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      color: #5F7C53;
      margin-bottom: 1.5rem;
      transition: 0.2s;
    }
    .back-home:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 245, 0.95);
    }

    .gratitude-card {
      background: rgba(254, 252, 245, 0.92);
      backdrop-filter: blur(2px);
      border-radius: 56px;
      padding: 2rem;
      max-width: 700px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 40px -12px rgba(50, 40, 20, 0.25);
      border: 1px solid rgba(255, 255, 245, 0.6);
    }

    .slogan {
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: lowercase;
      color: #7B9A6B;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .pebble-icon {
      font-size: 3rem;
      margin: 0.5rem 0;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .pebble-icon:active {
      transform: scale(0.95);
    }

    .input-area {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      flex-wrap: wrap;
      margin: 1rem 0;
    }
    .gratitude-input {
      background: rgba(255, 255, 245, 0.9);
      border: 1px solid #C2D5B3;
      border-radius: 60px;
      padding: 0.8rem 1.2rem;
      font-family: inherit;
      font-size: 1rem;
      width: 250px;
      outline: none;
    }
    .add-btn {
      background: #8BAF7A;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 60px;
      font-family: inherit;
      font-weight: 500;
      font-size: 1rem;
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }
    .add-btn:hover {
      background: #7A9E68;
      transform: translateY(-2px);
    }

    .pebbles-container {
      margin: 2rem 0 1rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
    }
    .pebble {
      background: #E8DCC8;
      border-radius: 50%;
      width: 80px;
      height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0.5rem;
      box-shadow: 0 6px 12px rgba(0,0,0,0.08);
      transition: transform 0.1s, background 0.2s;
      cursor: pointer;
      word-break: break-word;
      font-size: 0.75rem;
      color: #5F7C53;
      font-weight: 500;
    }
    .pebble:hover {
      transform: translateY(-4px);
      background: #D0C0A0;
    }

    .pebble-emoji {
      font-size: 1.5rem;
      margin-bottom: 0.2rem;
    }

    .clear-btn {
      background: rgba(230, 245, 220, 0.7);
      border: 1px solid #C2D5B3;
      padding: 0.5rem 1rem;
      border-radius: 60px;
      font-family: inherit;
      font-size: 0.8rem;
      color: #5F7C53;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 1rem;
    }
    .clear-btn:hover {
      background: rgba(200, 220, 180, 0.9);
    }

    .footer-note {
      margin-top: 1.5rem;
      font-size: 0.7rem;
      color: #8DAF7A;
    }
    .counter {
      font-size: 0.8rem;
      color: #6C8760;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>

<a href="index.html" class="back-home">← back to tools</a>

<div class="gratitude-card">
  <div class="slogan">🌼 gratitude pebble · collect small moments of thanks</div>
  <div class="pebble-icon" id="pebbleIcon">🪨</div>
  <div class="input-area">
    <input type="text" id="gratitudeInput" class="gratitude-input" placeholder="e.g., warm tea, a friend's text, sunshine" maxlength="60">
    <button class="add-btn" id="addBtn">add pebble</button>
  </div>
  <div class="counter" id="counter">you have <span id="pebbleCount">0</span> pebbles of gratitude</div>
  <div class="pebbles-container" id="pebblesContainer"></div>
  <button class="clear-btn" id="clearBtn">clear all pebbles</button>
  <div class="footer-note">click any pebble to see what you wrote. every tiny good thing counts.</div>
</div>

<script>
  // load existing pebbles from localStorage
  let pebbles = [];

  function savePebbles() {
    localStorage.setItem('gratitudePebbles', JSON.stringify(pebbles));
    renderPebbles();
  }

  function renderPebbles() {
    const container = document.getElementById('pebblesContainer');
    const countSpan = document.getElementById('pebbleCount');
    if (!container) return;
    container.innerHTML = '';
    pebbles.forEach((item, idx) => {
      const pebbleDiv = document.createElement('div');
      pebbleDiv.className = 'pebble';
      pebbleDiv.innerHTML = `<div class="pebble-emoji">🪨</div><div>${escapeHtml(item.text)}</div>`;
      pebbleDiv.title = `added ${item.date}`;
      pebbleDiv.addEventListener('click', () => {
        alert(`✨ ${item.text}\n— added on ${item.date}`);
      });
      container.appendChild(pebbleDiv);
    });
    countSpan.innerText = pebbles.length;
  }

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  function addGratitude() {
    const input = document.getElementById('gratitudeInput');
    let text = input.value.trim();
    if (text === '') {
      alert('write one thing you’re grateful for — even a single word 💛');
      return;
    }
    // limit length
    if (text.length > 60) text = text.substring(0, 57) + '...';
    const now = new Date();
    const dateStr = now.toLocaleDateString();
    pebbles.unshift({ text: text, date: dateStr });
    savePebbles();
    input.value = '';
    // little animation on the icon
    const icon = document.getElementById('pebbleIcon');
    icon.style.transform = 'scale(1.2)';
    setTimeout(() => { icon.style.transform = ''; }, 200);
  }

  function clearAll() {
    if (confirm('remove all your gratitude pebbles? (you can always add new ones)')) {
      pebbles = [];
      savePebbles();
    }
  }

  // load from localStorage on page load
  const stored = localStorage.getItem('gratitudePebbles');
  if (stored) {
    try {
      pebbles = JSON.parse(stored);
    } catch(e) { pebbles = []; }
  }
  renderPebbles();

  document.getElementById('addBtn').addEventListener('click', addGratitude);
  document.getElementById('clearBtn').addEventListener('click', clearAll);
  document.getElementById('gratitudeInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') addGratitude();
  });
</script>
</body>
</html>
