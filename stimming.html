<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>aurio · drift</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: linear-gradient(145deg, #1a2a1f 0%, #2d3e2a 100%);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      padding: 1rem;
      min-height: 100vh;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    .back-link {
      display: inline-block;
      background: rgba(30,40,25,0.7);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(200,190,160,0.3);
      padding: 0.5rem 1.2rem;
      border-radius: 60px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      color: #d4e6c2;
      margin-bottom: 1rem;
      transition: 0.2s;
    }
    .back-link:hover { transform: translateY(-2px); background: rgba(40,55,35,0.8); }
    .card {
      background: rgba(30,40,25,0.6);
      backdrop-filter: blur(8px);
      border-radius: 48px;
      padding: 1.5rem;
      box-shadow: 0 25px 40px -12px rgba(0,0,0,0.4);
      border: 1px solid rgba(200,210,170,0.2);
    }
    h1 {
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.5px;
      color: #eaf7e0;
      margin-bottom: 0.25rem;
    }
    .subhead {
      color: #b8ceaa;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .btn {
      background: rgba(50,70,40,0.7);
      border: 1px solid rgba(180,200,140,0.4);
      padding: 0.4rem 1.2rem;
      border-radius: 60px;
      color: #eaf7e0;
      cursor: pointer;
      font-size: 0.8rem;
      transition: 0.1s;
    }
    .btn:hover {
      background: #6b8c5c;
      border-color: #b8d4a0;
    }
    .palette {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      flex-wrap: wrap;
      margin-bottom: 1.2rem;
    }
    .color-dot {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid rgba(255,255,220,0.6);
      transition: 0.1s;
    }
    .color-dot.active {
      border: 3px solid #fff;
      transform: scale(1.08);
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #1a2a1a;
      border-radius: 32px;
      cursor: crosshair;
      touch-action: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .info {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.7rem;
      color: #9bbd8a;
    }
    footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.7rem;
      color: #8aa87a;
    }
    @media (max-width: 600px) {
      .card { padding: 1rem; }
      .color-dot { width: 32px; height: 32px; }
    }
  </style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back-link">← back to tools</a>
  <div class="card">
    <h1>🌫️ drift</h1>
    <div class="subhead">a gentle particle field – touch or move to create soft motion</div>

    <div class="palette" id="palette"></div>

    <div class="controls">
      <div class="btn" id="resetBtn">🍃 clear all</div>
      <div class="btn" id="soundBtn">🔊 sound off</div>
    </div>

    <canvas id="driftCanvas" width="900" height="550" style="width:100%; height:auto;"></canvas>
    <div class="info">✨ touch / drag – particles follow you. let them drift away. no goals, just calm.</div>
  </div>
  <footer>gentle sound on/off. colour changes new particles.</footer>
</div>

<script>
  (function(){
    const canvas = document.getElementById('driftCanvas');
    const ctx = canvas.getContext('2d');
    let width = 900, height = 550;
    let particles = [];
    let soundEnabled = false;  // start silent, user can enable
    let audioCtx = null;
    let currentColor = "#C2E0B0";

    // colour options (soft pastels)
    const colourOptions = [
      "#C2E0B0", "#E6C8A0", "#D8C3E5", "#A8D8D0", "#F0C0C0", "#B8D8E8", "#E0D0A0"
    ];
    function buildPalette() {
      const container = document.getElementById('palette');
      container.innerHTML = '';
      colourOptions.forEach(col => {
        const dot = document.createElement('div');
        dot.className = 'color-dot';
        dot.style.backgroundColor = col;
        if (col === currentColor) dot.classList.add('active');
        dot.addEventListener('click', () => {
          currentColor = col;
          document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
          dot.classList.add('active');
        });
        container.appendChild(dot);
      });
    }
    buildPalette();

    function resizeCanvas() {
      const container = canvas.parentElement;
      const maxWidth = Math.min(900, container.clientWidth);
      canvas.width = maxWidth;
      canvas.height = (maxWidth * 550) / 900;
      width = canvas.width;
      height = canvas.height;
    }
    window.addEventListener('resize', () => { resizeCanvas(); drawParticles(); });
    resizeCanvas();

    // particle class
    class Particle {
      constructor(x, y, vx, vy, color) {
        this.x = x;
        this.y = y;
        this.vx = vx || (Math.random() - 0.5) * 0.6;
        this.vy = vy || (Math.random() - 0.5) * 0.6 - 0.3;
        this.size = 4 + Math.random() * 5;
        this.life = 1;
        this.decay = 0.003 + Math.random() * 0.006;
        this.color = color || currentColor;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
        // wrap around edges gently
        if (this.x < -20) this.x = width + 20;
        if (this.x > width + 20) this.x = -20;
        if (this.y < -20) this.y = height + 20;
        if (this.y > height + 20) this.y = -20;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.life * 0.8;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * (0.4 + this.life * 0.6), 0, Math.PI*2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(this.x-2, this.y-2, this.size * 0.3, 0, Math.PI*2);
        ctx.fillStyle = "rgba(255,245,200,0.6)";
        ctx.fill();
        ctx.restore();
      }
    }

    function addParticle(x, y, color) {
      particles.push(new Particle(x, y, (Math.random()-0.5)*1.2, (Math.random()-0.5)*1.2 - 0.5, color));
      // limit total particles to keep performance smooth
      if (particles.length > 400) particles.shift();
    }

    // create initial gentle swarm
    for (let i = 0; i < 80; i++) {
      particles.push(new Particle(Math.random() * width, Math.random() * height));
    }

    let lastX = null, lastY = null;
    function handleMove(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      let clientX, clientY;
      if (e.touches) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
        e.preventDefault();
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }
      let canvasX = (clientX - rect.left) * scaleX;
      let canvasY = (clientY - rect.top) * scaleY;
      canvasX = Math.min(Math.max(0, canvasX), width);
      canvasY = Math.min(Math.max(0, canvasY), height);
      if (lastX !== null) {
        // add particles along the line
        const dist = Math.hypot(canvasX - lastX, canvasY - lastY);
        const steps = Math.min(15, Math.floor(dist / 5) + 1);
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const x = lastX + (canvasX - lastX) * t;
          const y = lastY + (canvasY - lastY) * t;
          addParticle(x, y, currentColor);
          if (soundEnabled && Math.random() < 0.08) playSoftTone();
        }
      } else {
        addParticle(canvasX, canvasY, currentColor);
      }
      lastX = canvasX;
      lastY = canvasY;
    }
    function handleEnd() {
      lastX = null;
      lastY = null;
    }
    canvas.addEventListener('mousemove', handleMove);
    canvas.addEventListener('touchmove', handleMove);
    canvas.addEventListener('mousedown', handleMove);
    canvas.addEventListener('touchstart', handleMove);
    canvas.addEventListener('mouseup', handleEnd);
    canvas.addEventListener('touchend', handleEnd);
    canvas.addEventListener('mouseleave', handleEnd);

    // reset all particles
    document.getElementById('resetBtn').addEventListener('click', () => {
      particles = [];
      for (let i = 0; i < 60; i++) {
        particles.push(new Particle(Math.random() * width, Math.random() * height));
      }
    });

    // sound
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function playSoftTone() {
      if (!soundEnabled) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = 700 + Math.random() * 300;
      gain.gain.value = 0.03;
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
      osc.stop(audioCtx.currentTime + 0.2);
    }
    const soundBtn = document.getElementById('soundBtn');
    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundBtn.innerText = soundEnabled ? "🔊 sound on" : "🔇 sound off";
      if (soundEnabled && !audioCtx) initAudio();
    });

    // animation loop
    function animate() {
      if (!ctx) return;
      ctx.clearRect(0, 0, width, height);
      for (let i = particles.length-1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].life <= 0) {
          particles.splice(i,1);
        }
      }
      requestAnimationFrame(animate);
    }
    animate();
  })();
</script>
</body>
</html>
