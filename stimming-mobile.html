<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>aurio · touch drift</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background: linear-gradient(145deg, #1a2a1f 0%, #2d3e2a 100%);
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
    }

    /* header area */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .back-link {
      background: rgba(30,40,25,0.7);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(200,190,160,0.3);
      padding: 6px 14px;
      border-radius: 40px;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 500;
      color: #d4e6c2;
    }
    .title {
      font-size: 1.2rem;
      font-weight: 400;
      color: #eaf7e0;
    }

    /* colour palette (reasonable size) */
    .palette {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 5px 0;
    }
    .color-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid rgba(255,255,220,0.6);
      transition: 0.1s;
    }
    .color-dot.active {
      border: 2px solid white;
      transform: scale(1.05);
    }

    /* controls */
    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 5px 0;
    }
    .btn {
      background: rgba(50,70,40,0.7);
      border: 1px solid rgba(180,200,140,0.4);
      padding: 6px 16px;
      border-radius: 40px;
      color: #eaf7e0;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
    }

    /* canvas container - takes remaining space */
    .canvas-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;  /* important for flex children to shrink */
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #1a2a1a;
      border-radius: 28px;
      cursor: crosshair;
      touch-action: none;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      /* ensure canvas fills container vertically */
      flex: 1;
      min-height: 300px;
    }

    .info {
      text-align: center;
      font-size: 0.7rem;
      color: #9bbd8a;
      margin-top: 6px;
    }
    footer {
      text-align: center;
      font-size: 0.65rem;
      color: #8aa87a;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="index.html" class="back-link">← back</a>
    <span class="title">✨ touch drift ✨</span>
    <div style="width: 60px;"></div> <!-- spacer for balance -->
  </div>

  <div class="palette" id="palette"></div>

  <div class="controls">
    <div class="btn" id="resetBtn">🍃 clear</div>
    <div class="btn" id="soundBtn">🔊 off</div>
  </div>

  <div class="canvas-container">
    <canvas id="driftCanvas" width="600" height="400" style="width:100%; height:auto;"></canvas>
  </div>
  <div class="info">👆 drag your finger – soft particles follow</div>
  <footer>gentle sound optional · colour changes new particles</footer>

<script>
  (function(){
    const canvas = document.getElementById('driftCanvas');
    const ctx = canvas.getContext('2d');
    let width = 600, height = 400;
    let particles = [];
    let soundEnabled = false;
    let audioCtx = null;
    let currentColor = "#C2E0B0";

    const colourOptions = ["#C2E0B0", "#E6C8A0", "#D8C3E5", "#A8D8D0", "#F0C0C0", "#B8D8E8", "#E0D0A0"];
    function buildPalette() {
      const container = document.getElementById('palette');
      container.innerHTML = '';
      colourOptions.forEach(col => {
        const dot = document.createElement('div');
        dot.className = 'color-dot';
        dot.style.backgroundColor = col;
        if (col === currentColor) dot.classList.add('active');
        dot.addEventListener('click', () => {
          currentColor = col;
          document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
          dot.classList.add('active');
        });
        container.appendChild(dot);
      });
    }
    buildPalette();

    function resizeCanvas() {
      const container = canvas.parentElement;
      const maxWidth = container.clientWidth;
      // keep aspect ratio but let it fill flex
      canvas.width = maxWidth;
      canvas.height = Math.min(600, maxWidth * 0.7);
      width = canvas.width;
      height = canvas.height;
    }
    window.addEventListener('resize', () => { resizeCanvas(); });
    resizeCanvas();

    class Particle {
      constructor(x, y, vx, vy, color) {
        this.x = x;
        this.y = y;
        this.vx = vx || (Math.random() - 0.5) * 1.2;
        this.vy = vy || (Math.random() - 0.5) * 1.2 - 0.5;
        this.size = 5 + Math.random() * 7;
        this.life = 1;
        this.decay = 0.008 + Math.random() * 0.008;
        this.color = color || currentColor;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
        if (this.x < -30) this.x = width + 30;
        if (this.x > width + 30) this.x = -30;
        if (this.y < -30) this.y = height + 30;
        if (this.y > height + 30) this.y = -30;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.life * 0.7;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * (0.4 + this.life * 0.6), 0, Math.PI*2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(this.x-2, this.y-2, this.size * 0.3, 0, Math.PI*2);
        ctx.fillStyle = "rgba(255,245,200,0.5)";
        ctx.fill();
        ctx.restore();
      }
    }

    function addParticle(x, y, color) {
      particles.push(new Particle(x, y, (Math.random()-0.5)*1.5, (Math.random()-0.5)*1.5, color));
      if (particles.length > 400) particles.shift();
    }

    // initial gentle swarm
    for (let i = 0; i < 70; i++) {
      particles.push(new Particle(Math.random() * width, Math.random() * height));
    }

    let lastX = null, lastY = null;
    let lastTimestamp = 0;

    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      let clientX, clientY;
      if (e.touches) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
        e.preventDefault();
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }
      let canvasX = (clientX - rect.left) * scaleX;
      let canvasY = (clientY - rect.top) * scaleY;
      canvasX = Math.min(Math.max(0, canvasX), width);
      canvasY = Math.min(Math.max(0, canvasY), height);
      return { x: canvasX, y: canvasY };
    }

    function handleMove(e) {
      const { x, y } = getCanvasCoords(e);
      const now = Date.now();
      if (lastX !== null && (now - lastTimestamp) < 50) {
        const steps = Math.min(10, Math.floor(Math.hypot(x - lastX, y - lastY) / 5) + 1);
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const ix = lastX + (x - lastX) * t;
          const iy = lastY + (y - lastY) * t;
          addParticle(ix, iy, currentColor);
          if (soundEnabled && Math.random() < 0.1) playSoftTone();
        }
      } else {
        addParticle(x, y, currentColor);
        if (soundEnabled && Math.random() < 0.1) playSoftTone();
      }
      lastX = x;
      lastY = y;
      lastTimestamp = now;
    }

    function handleEnd() {
      lastX = null;
      lastY = null;
    }

    canvas.addEventListener('mousemove', handleMove);
    canvas.addEventListener('touchmove', handleMove);
    canvas.addEventListener('mousedown', handleMove);
    canvas.addEventListener('touchstart', handleMove);
    canvas.addEventListener('mouseup', handleEnd);
    canvas.addEventListener('touchend', handleEnd);
    canvas.addEventListener('mouseleave', handleEnd);

    document.getElementById('resetBtn').addEventListener('click', () => {
      particles = [];
      for (let i = 0; i < 60; i++) {
        particles.push(new Particle(Math.random() * width, Math.random() * height));
      }
    });

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function playSoftTone() {
      if (!soundEnabled) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = 500 + Math.random() * 400;
      gain.gain.value = 0.03;
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
      osc.stop(audioCtx.currentTime + 0.2);
    }
    const soundBtn = document.getElementById('soundBtn');
    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundBtn.innerText = soundEnabled ? "🔊 on" : "🔇 off";
      if (soundEnabled && !audioCtx) initAudio();
    });

    function drawLoop() {
      if (!ctx) return;
      ctx.clearRect(0, 0, width, height);
      for (let p of particles) {
        p.draw();
      }
      requestAnimationFrame(drawLoop);
    }
    function updateLoop() {
      for (let i = particles.length-1; i >= 0; i--) {
        particles[i].update();
        if (particles[i].life <= 0) particles.splice(i,1);
      }
      requestAnimationFrame(updateLoop);
    }
    drawLoop();
    updateLoop();
  })();
</script>
</body>
</html>
