<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>aurio · friendly study tools</title>
  <style>
    /* ... (all your existing CSS from the previous working version) ... */
    /* For brevity, I'll include the full CSS from the last working version, but with one addition: */
    .nav-buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: 1rem 0 1.5rem;
    }
    .nav-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.5rem 1.2rem;
      border-radius: 60px;
      text-decoration: none;
      color: var(--text);
      font-weight: 500;
      transition: 0.1s;
      cursor: pointer;
    }
    .nav-btn:hover {
      transform: translateY(-2px);
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    /* (rest of your CSS remains exactly the same) */
  </style>
  <!-- ... (head links etc) ... -->
</head>
<body data-theme="baby pink" class="font-helvetica">
<div class="container">
  <!-- top bar unchanged -->
  <div class="top-bar">...</div>

  <!-- NEW: navigation buttons -->
  <div class="nav-buttons">
    <button class="nav-btn" id="navMindfulness">🌱 mindfulness & wellness</button>
    <button class="nav-btn" id="navAcademic">📚 academic helpers</button>
  </div>

  <!-- add id="mindfulness" to the section title -->
  <div class="section-title" id="mindfulness">🌱 mindfulness & wellness</div>
  <div class="tools-grid">...</div>

  <!-- add id="academic" to the academic section title -->
  <div class="section-title" id="academic">📚 academic helpers</div>
  <div class="tools-grid">...</div>

  <!-- rest of page unchanged -->
</div>
<script>
  // Add smooth scroll for navigation buttons
  document.getElementById('navMindfulness').addEventListener('click', () => {
    document.getElementById('mindfulness').scrollIntoView({ behavior: 'smooth' });
  });
  document.getElementById('navAcademic').addEventListener('click', () => {
    document.getElementById('academic').scrollIntoView({ behavior: 'smooth' });
  });
  // ... (all your existing JavaScript remains exactly the same)
</script>
</body>
</html>
